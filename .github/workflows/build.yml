name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Preuzmi kod repozitorija
        uses: actions/checkout@v4

      - name: ⚙️ Postavi Java okruženje
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: 📦 Provjeri ovisnosti
        run: flutter pub get

      - name: 🛠️ Generiraj Android strukturu (v2 embedding)
        run: flutter create . --platforms=android --org com.example

      - name: 🌐 Dodaj dozvolu za internet u AndroidManifest
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: 🔨 Izgradi APK
        run: flutter build apk --release

      - name: 💾 Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-prijevoza-apk
          path: build/app/outputs/flutter-apk/app-release.apk
