name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Skeniraj repozitorij
        uses: actions/checkout@v4

      - name: Postavi Java okruženje
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavi Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Instaliraj pakete (Dependencies)
        run: flutter pub get

      - name: Izgradi Android APK
        run: flutter build apk --release

      - name: Spremi APK datoteku kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-prijevoza-apk
          path: build/app/outputs/flutter-apk/app-release.apk
