name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Skeniraj repozitorij
        uses: actions/checkout@v4

      - name: Postavi Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Kreiraj projekt i postavi okruženje
        run: |
          flutter create -t app . --org com.tino.prijevoz --project-name prijevoz_kalkulator

      - name: Provjeri ovisnosti
        run: flutter pub get

      - name: Izgradi APK
        run: flutter build apk --release

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-prijevoza-apk
          path: build/app/outputs/flutter-apk/app-release.apk
